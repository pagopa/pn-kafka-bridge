AWSTemplateFormatVersion: '2010-09-09'
Description: Some storage with input and output

Parameters:
  ProjectName:
    Type: String
    Description: Nome dell'ambiente destinazione

  # Unused but required by CD pipeline
  MicroserviceNumber:
    Type: Number
    Description: An unique number that identify the microservice inside the ECS cluster.

  # Unused but required by CD pipeline
  TemplateBucketBaseUrl:
    Type: String
    Description: URL da cui caricare i frammenti di template di infrastruttura

  Version:
    Type: String
    Description: 'keep track of used projects commitIds'

  LogsKinesisSourceStreamArn:
    Type: String
    Description: 'Where to send Logs'

  AlarmSNSTopicName:
    Type: String
    Description: 'Topic alarm'

  LogRetention:
    Type: Number
    Default: 14

Conditions:
  Never: !Equals [ 'true', 'false' ]

Resources:

  KafkaBridgePaymentsQueue:
    Type: AWS::CloudFormation::Stack
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/sqs-queue.yaml"
      Parameters:
        QueueName: !Sub '${ProjectName}-kafka-bridge-payments'
        AlarmSNSTopicName: !Ref AlarmSNSTopicName
        VisibilityTimeout: 60
        MaxReceiveCount: 10
        DelaySeconds: 1

  PnKafkaBridgeLogGroup:
    Type: AWS::CloudFormation::Stack
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain 
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/log-group.yaml"
      Parameters:
        LogGroupName: !Sub '${ProjectName}-kafka-bridge'
        LogGroupRetention: !Ref LogRetention
        LogsKinesisSourceStreamArn: !Ref LogsKinesisSourceStreamArn

Outputs:
  # Log group exports
  EcsLogGroup:
    Value: !GetAtt PnKafkaBridgeLogGroup.Outputs.LogGroupName

  KafkaBridgePaymentsQueueName:
    Value: !GetAtt KafkaBridgePaymentsQueue.Outputs.QueueName
    Description: pn-kafka-bridge payments queue name
  KafkaBridgePaymentsQueueARN:
    Value: !GetAtt KafkaBridgePaymentsQueue.Outputs.QueueARN
    Description: pn-kafka-bridge payments queue ARN
  KafkaBridgePaymentsQueueAlarmARN:
    Value: !GetAtt KafkaBridgePaymentsQueue.Outputs.SqsDLQAlarmArn
    Description: pn-kafka-bridge payments queue dlq alarm queue
  KafkaBridgePaymentsQueueAgeAlarmARN:
    Value: !GetAtt KafkaBridgePaymentsQueue.Outputs.SqsAgeAlarmArn
    Description: pn-kafka-bridge payments queue age alarm ARN
  KafkaBridgePaymentsQueueDLQName:
    Value: !GetAtt KafkaBridgePaymentsQueue.Outputs.DeadLetterQueueName
    Description: pn-kafka-bridge payments queue dlq name
  KafkaBridgePaymentsQueueDLQARN:
    Value: !GetAtt KafkaBridgePaymentsQueue.Outputs.DeadLetterQueueARN
    Description: pn-kafka-bridge payments queue dlq name