AWSTemplateFormatVersion: 2010-09-09
Description: 'Example microservice deploy'

Transform:
  - UpdateDeploymentTransform

Parameters:
  ProjectName:
    Type: String
    Description: 'Usually pn can be pnXYZ where XYZ are the feature number, useful to create
      experimental environments without crash official development environment'

  KafkaOnboardingTopicName:
    Type: String
    Description: 'Kafka topic name for onboarding institutions'
    Default: 'sc-contracts'

  KafkaOnboardingGroupId:
    Type: String
    Description: 'Kafka group id for onboarding institutions'
    Default: ''

  KafkaOnboardingBootstrapServers:
    Type: String
    Description: 'Kafka bootstrap servers'
    Default: ''

  KafkaDelegationsTopicName:
    Type: String
    Description: 'Kafka topic name for delegations'
    Default: 'sc-delegations'

  KafkaDelegationsGroupId:
    Type: String
    Description: 'Kafka group id for delegations'
    Default: ''

  KafkaDelegationsBootstrapServers:
    Type: String
    Description: 'Kafka server for delegations'
    Default: ''

  KafkaPaymentEventsTopicName:
    Type: String
    Description: 'Kafka topic name for payment events'
    Default: ''

  KafkaPaymentEventsGroupId:
    Type: String
    Description: 'Kafka group id for payment events'
    Default: ''

  KafkaPaymentEventsBootstrapServers:
    Type: String
    Description: 'Kafka server for payment events'
    Default: ''

  SelfcarePnProductId:
    Type: String
    Description: 'Selfcare product id'

  KafkaBridgeOnboardingQueueName:
    Type: String
    Description: 'Queue name of Kafka bridge messages for onboarding institutes'

  KafkaBridgeOnboardingQueueARN:
    Type: String
    Description: 'Queue ARN of Kafka bridge messages for onboarding institutes'

  KafkaBridgeOnboardingQueueAlarmARN:
    Type: String
    Description: 'pn-kafka-bridge onboarding institutes queue alarm ARN'

  KafkaBridgeOnboardingQueueAgeAlarmARN:
    Type: String
    Description: pn-kafka-bridge onboarding institute queue age alarm ARN

  KafkaBridgeAutoCommitIntervalMillis:
    Type: Number
    Description: auto commit interval in millis
    Default: 1000

  AlarmSNSTopicArn:
    Type: String
    Description: 'ARN of alarm topic'

  ECSClusterName:
    Type: String
    Description: 'The name of the ECS cluster where the microservice is going to be deployed'

  SubnetsIds:
    Type: String
    Description: 'subnets ids comma separated list. Where to deploy the microservice'

  VpcEgressSubnetsIds:
    Type: String
    Description: subnets where to install PN-CORE

  VpcId:
    Type: String
    Description: 'VpcId where the microservice is going to be deployed'

  EcsDefaultSecurityGroup:
    Type: String
    Description: 'Default security group required by infrastructure'

  TemplateBucketBaseUrl:
    Type: String
    Description: 'The S3 bucket from which to fetch the templates used by this stack.'

  ContainerImageUri:
    Type: String
    Description: 'Exact container image URI with full repository and image digest'

  CorsAllowedDomains:
    Type: String
    Description: 'Comma separated list of domains allowed to make cross origin request'

  Version:
    Type: String
    Description: 'Keep track of used projects commitIds'

  MicroserviceNumber:
    Type: Number
    Description: 'Disambiguation useful for load balancer rules'

  ApplicationLoadBalancerListenerArn:
    Type: String
    Description: 'Load balancer listener where HTTP endpoints is going to be registered'

  AlbSecurityGroup:
    Type: String
    Description: 'Application load balancer security group'

  # Logging parameters
  WireTapLogActivation:
    Type: String
    Default: false
    Description: Activation of wire logs
    AllowedValues:
      - true
      - false

  PnCronAnalyzer:
    Type: String
    Default: '-'
    Description: Cron for which you send the metric to CloudWatch

  # EFS parameters
  FargateEFSFileSystemID:
    Type: String
    Description: "EFS Filesystem"

  MountEfs:
    Type: String
    Default: false
    AllowedValues:
      - "true"
      - "false"

  KafkaBridgePaymentsQueueName:
    Type: String
    Description: 'Name of the queue containing payments from pagoPa'

  KafkaBridgePaymentsQueueARN:
    Type: String
    Description: 'Send and pull pagoPa payments to this queue'

  KafkaBridgePaymentsQueueAlarmARN:
    Type: String
    Description: kafka bridge payments queue dlq alarm ARN

  KafkaBridgePaymentsQueueAgeAlarmARN:
    Type: String
    Description: kafka bridge payments queue age alarm ARN

  KafkaBridgePaymentsQueueDLQName:
    Type: String
    Description: kafka bridge payments dlq queue name

  KafkaBridgePaymentsQueueDLQARN:
    Type: String
    Description: kafka bridge payments dlq queue ARN

  KafkaBridge2NotificationCostServiceQueueName:
    Type: String
    Description: Events from pn-kafka-bridge TO pn-notification-cost-service queue name

  KafkaBridge2NotificationCostServiceQueueARN:
    Type: String
    Description: Events from pn-kafka-bridge TO pn-notification-cost-service queue ARN

  # Log group parameters
  EcsLogGroup:
    Type: String
    Description: 'Ecs log group name'

  # Heath Check parameters
  HealthCheckInterval:
    Description: Seconds between two health check
    Type: Number
    Default: 60

  HealthCheckTimeout:
    Description: health check timeout seconds
    Type: Number
    Default: 5
  
  HealthyThresholdCount:
    Description: |
      The number of consecutive health checks successes required before considering 
      an unhealthy target healthy. 
    Type: Number
    Default: 5
  
  UnhealthyThresholdCount:
    Description: |
      The number of consecutive health check failures required before considering a target unhealthy. 
    Type: Number
    Default: 2

  # Instance parameters
  # 256 (.25 vCPU) - Available memory values: 0.5GB, 1GB, 2GB
  # 512 (.5 vCPU) - Available memory values: 1GB, 2GB, 3GB, 4GB
  # 1024 (1 vCPU) - Available memory values: 2GB, 3GB, 4GB, 5GB, 6GB, 7GB, 8GB
  # 2048 (2 vCPU) - Available memory values: Between 4GB and 16GB in 1GB increments
  # 4096 (4 vCPU) - Available memory values: Between 8GB and 30GB in 1GB increments
  CpuValue:
    Type: Number
    Default: 1024
    Description: Fargate virtual CPU quantity 1024 equals one vCPU

  # 0.5GB, 1GB, 2GB - Available cpu values: 256 (.25 vCPU)
  # 1GB, 2GB, 3GB, 4GB - Available cpu values: 512 (.5 vCPU)
  # 2GB, 3GB, 4GB, 5GB, 6GB, 7GB, 8GB - Available cpu values: 1024 (1 vCPU)
  # Between 4GB and 16GB in 1GB increments - Available cpu values: 2048 (2 vCPU)
  # Between 8GB and 30GB in 1GB increments - Available cpu values: 4096 (4 vCPU)
  MemoryAmount:
    Type: String
    Default: 2GB
    Description: memory amount reserved to the task pod.
    AllowedValues: [ 2GB, 4GB, 6GB, 8GB ]

  # Autoscaling parameters
  AutoscalingCheckPeriod:
    Default: 60
    Type: Number
    Description: minimum autoscaling number of tasks\

  AutoscalingDataPointN:
    Default: 1
    Type: Number
    Description: activate when N datapoint on M

  AutoscalingDataPointM:
    Default: 1
    Type: Number
    Description: activate when N datapoint on M

  AutoscalingThreshold:
    Default: 70
    Type: String
  
  MinTasksNumber:
    Default: 1
    Type: Number
    Description: minimum autoscaling number of tasks

  MaxTasksNumber:
    Default: 6
    Type: Number
    Description: maximum autoscaling number of tasks 
    
  LogAlarmStrategy:
    Type: String
    Default: 'ERROR_FATAL'

  CpuArchitecture:
    Type: String
    Default: 'ARM'
    Description: CPU architecture for the Fargate tasks

  JavaToolOptions:
    Type: String
    Default: '-Dreactor.netty.ioWorkerCount=50 --add-modules=java.instrument --add-opens=java.base/java.lang=ALL-UNNAMED'
    Description: Java tool options for the Fargate tasks

  KafkaPaymentMaxPollRecords:
    Type: Number
    Default: 200
    Description: Max poll for payments records

  KafkaPaymentFetchMinBytes:
    Type: Number
    Default: 256000
    Description: Minimum fetch bytes for payments records

  KafkaPaymentFetchMaxWaitMs:
    Type: Number
    Default: 10000
    Description: Maximum wait time in milliseconds for fetching payments records

  KafkaPaymentConcurrency:
    Type: Number
    Default: 1
    Description: Concurrency level for processing payments records

  MetricFormatType:
    Type: String
    Description: 'Metric format type'

  PnKafkaBridgeMetricsPaymentsEventsCron:
    Type: String
    Description: 'Cron expression for scheduling the publishing of payment events metrics'
    Default: '0 */5 * * * *'

Resources:

  # PN-Kafka-Bridge microservice
  KafkaBridgeMicroservice:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/ecs-service.yaml"
      Parameters:
        MicroServiceUniqueName: !Sub '${ProjectName}-kafka-bridge'
        CpuValue: !Ref CpuValue
        MemoryAmount: !Ref MemoryAmount
        HealthCheckTimeout: !Ref HealthCheckTimeout
        HealthCheckInterval: !Ref HealthCheckInterval
        HealthyThresholdCount: !Ref HealthyThresholdCount
        UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
        AutoscalingStrategy: REST-API
        AutoscalingThreshold: !Ref AutoscalingThreshold
        AutoscalingCheckPeriod: !Ref AutoscalingCheckPeriod
        MinTasksNumber: !Ref MinTasksNumber
        MaxTasksNumber: !Ref MaxTasksNumber
        EfsFilesystem: !Ref FargateEFSFileSystemID
        MountEfs: !Ref MountEfs
        WireTapLogActivation: !Ref WireTapLogActivation
        AutoscalingDataPointN: !Ref AutoscalingDataPointN
        AutoscalingDataPointM: !Ref AutoscalingDataPointM
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn
        ContainerImageURI: !Sub '${ContainerImageUri}'
        ContainerEnvEntry1: !Sub 'AWS_REGIONCODE=${AWS::Region}'
        ContainerEnvEntry2: !Sub 'CORS_ALLOWED_DOMAINS=${CorsAllowedDomains}'
        ContainerEnvEntry3: !Sub 'PN_KAFKA_BRIDGE_ONBOARDING_CONTRACTS_TOPIC_NAME=${KafkaOnboardingTopicName}'
        ContainerEnvEntry4: !Sub 'PN_KAFKA_BRIDGE_ONBOARDING_CONTRACTS_GROUP_ID=${KafkaOnboardingGroupId}'
        ContainerEnvEntry5: !Sub 'PN_KAFKA_BRIDGE_ONBOARDING_CONTRACTS_BOOTSTRAP_SERVERS=${KafkaOnboardingBootstrapServers}'
        ContainerEnvEntry6: !Sub 'PN_KAFKA_BRIDGE_SELFCARE_PN_PRODUCT_ID=${SelfcarePnProductId}'
        ContainerEnvEntry7: !Sub 'PN_KAFKA_BRIDGE_SQS_TOPICS_ONBOARDING_INPUT=${KafkaBridgeOnboardingQueueName}'
        ContainerEnvEntry8: !Sub 'PN_CRON_ANALYZER=${PnCronAnalyzer}'
        ContainerEnvEntry9: !Sub 'WIRE_TAP_LOG=${WireTapLogActivation}'
        ContainerEnvEntry10: !Sub 'PN_KAFKA_BRIDGE_ONBOARDING_CONTRACTS_PROPERTIES_AUTO_COMMIT_INTERVAL_MS=${KafkaBridgeAutoCommitIntervalMillis}'
        ContainerEnvEntry11: !Sub 'PN_KAFKA_BRIDGE_DELEGATIONS_TOPIC_NAME=${KafkaDelegationsTopicName}'
        ContainerEnvEntry12: !Sub 'PN_KAFKA_BRIDGE_DELEGATIONS_GROUP_ID=${KafkaDelegationsGroupId}'
        ContainerEnvEntry13: !Sub 'PN_KAFKA_BRIDGE_DELEGATIONS_BOOTSTRAP_SERVERS=${KafkaDelegationsBootstrapServers}'
        ContainerEnvEntry14: !Sub 'PN_KAFKA_BRIDGE_DELEGATIONS_PROPERTIES_AUTO_COMMIT_INTERVAL_MS=${KafkaBridgeAutoCommitIntervalMillis}'
        ContainerEnvEntry15: !Sub 'PN_KAFKA_BRIDGE_SQS_TOPICS_DELEGATIONS_INPUT=${ProjectName}-kafka_bridge_delegations'
        ContainerEnvEntry16: !Sub 'PN_KAFKA_BRIDGE_PAYMENT_EVENTS_PROPERTIES_MAX_POLL_RECORDS=${KafkaPaymentMaxPollRecords}'
        ContainerEnvEntry17: !Sub 'PN_KAFKA_BRIDGE_PAYMENT_EVENTS_PROPERTIES_FETCH_MIN_BYTES=${KafkaPaymentFetchMinBytes}'
        ContainerEnvEntry18: !Sub 'PN_KAFKA_BRIDGE_PAYMENT_EVENTS_PROPERTIES_FETCH_MAX_WAIT_MS=${KafkaPaymentFetchMaxWaitMs}'
        ContainerEnvEntry19: !Sub 'PN_KAFKA_BRIDGE_PAYMENT_EVENTS_CONCURRENCY=${KafkaPaymentConcurrency}'
        ContainerEnvEntry20: !Sub 'PN_KAFKA_BRIDGE_PAYMENT_EVENTS_TOPIC_NAME=${KafkaPaymentEventsTopicName}'
        ContainerEnvEntry21: !Sub 'PN_KAFKA_BRIDGE_PAYMENT_EVENTS_GROUP_ID=${KafkaPaymentEventsGroupId}'
        ContainerEnvEntry22: !Sub 'PN_KAFKA_BRIDGE_PAYMENT_EVENTS_BOOTSTRAP_SERVERS=${KafkaPaymentEventsBootstrapServers}'
        ContainerEnvEntry23: !Sub 'PN_KAFKA_BRIDGE_SQS_TOPICS_ERROR_EVENT_INPUT=${KafkaBridgePaymentsQueueDLQName}'
        ContainerEnvEntry24: !Sub 'PN_KAFKA_BRIDGE_SQS_TOPICS_KAFKA_BRIDGE_PAYMENTS=${KafkaBridgePaymentsQueueName}'
        ContainerEnvEntry25: !Sub 'PN_KAFKA_BRIDGE_SQS_TOPICS_PAYMENTS_TO_VERIFY=${KafkaBridge2NotificationCostServiceQueueName}'
        ContainerEnvEntry26: !Sub 'METRIC_FORMAT_TYPE=${MetricFormatType}'
        ContainerEnvEntry27: !Sub 'PN_KAFKA_BRIDGE_METRICS_PAYMENTS_EVENTS_CRON=${PnKafkaBridgeMetricsPaymentsEventsCron}'
        ContainerSecret1: !Sub 'KAFKA_ONBOARDING_SASL_JAAS_PASSWORD=arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pn-KafkaBridge-Secrets:KafkaOnboardingSaslJaasConfig:AWSCURRENT:'
        ContainerSecret2: !Sub 'KAFKA_DELEGATIONS_SASL_JAAS_PASSWORD=arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pn-KafkaBridge-Secrets:KafkaDelegationsSaslJaasConfig:AWSCURRENT:'
        ContainerSecret3: !Sub 'KAFKA_PAYMENT_SASL_JAAS_PASSWORD=arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pn-KafkaBridge-Secrets:KafkaPaymentEventsSaslJaasConfig:AWSCURRENT:'
        MicroServiceSecretPrefix: pn-KafkaBridge-Secrets
        JavaToolOptions: !Ref JavaToolOptions
        JavaVersion: '25'
        MappedPaths: '/kafka-bridge/*'
        ECSClusterName: !Ref ECSClusterName
        Subnets: !Ref VpcEgressSubnetsIds
        VpcId: !Ref VpcId
        EcsDefaultSecurityGroup: !Ref EcsDefaultSecurityGroup
        LoadBalancerListenerArn: !Ref ApplicationLoadBalancerListenerArn
        LoadbalancerRulePriority: !Ref MicroserviceNumber
        TaskRoleManagedPolicyArn: !Ref KafkaBridgeMicroserviceTaskManagedPolicy
        AlbSecurityGroup: !Ref AlbSecurityGroup
        EcsLogGroup: !Ref EcsLogGroup
        LogAlarmStrategyV1: !Ref LogAlarmStrategy
        DisableOncallAlarm: true
        CpuArchitecture: !Ref CpuArchitecture

  KafkaBridgeMicroserviceTaskManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:ChangeMessageVisibilityBatch
              - sqs:DeleteMessage
              - sqs:DeleteMessageBatch
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ReceiveMessage
              - sqs:SendMessage
              - sqs:SendMessageBatch
            Resource:
              - !Ref KafkaBridgeOnboardingQueueARN
              - !Ref KafkaBridgePaymentsQueueARN
              - !Ref KafkaBridgePaymentsQueueDLQARN
              - !Ref KafkaBridge2NotificationCostServiceQueueARN
          - Effect: Allow
            Action:
              - sqs:GetQueueUrl
              - sqs:SendMessage
              - sqs:SendMessageBatch
            Resource:
              - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${ProjectName}-kafka_bridge_delegations'

  ## Dashboard
  KafkaBridgeMicroserviceCloudWatchDashboard:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/microservice-cloudwatch-dashboard.yaml"
      Parameters:
        DashboardName: !Sub "${ProjectName}-kafka-bridge"
        AlarmArns: !Join
          - ','
          - - !GetAtt KafkaBridgeMicroservice.Outputs.FatalLogsMetricAlarmArn
            - !Ref KafkaBridgeOnboardingQueueAlarmARN
            - !Ref KafkaBridgeOnboardingQueueAgeAlarmARN
            - !Ref KafkaBridgePaymentsQueueAlarmARN
            - !Ref KafkaBridgePaymentsQueueAgeAlarmARN
        QueueArns: !Join
          - ','
          - - !Ref KafkaBridgeOnboardingQueueARN
            - !Ref KafkaBridgePaymentsQueueARN
        LogGroupsNames: !Join
          - ','
          - - !Sub '/aws/ecs/${ProjectName}-kafka-bridge'


Outputs:
  Version:
    Description: Git commit id of this file
    Value: !Ref Version
