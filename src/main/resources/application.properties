logging.config=classpath:logback-base.xml

spring.application.name=PN-KAFKA-BRIDGE

# Configurazioni AWS
aws.profile-name=${PN_AWS_PROFILE_NAME:default}
aws.region-code=us-east-1
aws.endpoint-url=http://localhost:4566


spring.cloud.aws.region.static=${AWS_REGIONCODE:us-east-1}
#spring.cloud.aws.credentials.profile-name=${PN_AWS_PROFILE_NAME:default}
#spring.cloud.aws.endpoint=http://localhost:4566


pn.kafka-bridge.onboarding-contracts.bootstrap-servers=selc-u-eventhub-ns.servicebus.windows.net:9093
pn.kafka-bridge.onboarding-contracts.group-id=pn-onboarding-local
pn.kafka-bridge.onboarding-contracts.topic-name=sc-contracts
pn.kafka-bridge.onboarding-contracts.auth-exception-retry-interval=60s
pn.kafka-bridge.onboarding-contracts.properties.security.protocol=SASL_SSL
pn.kafka-bridge.onboarding-contracts.sasl-jaas-password=${KAFKA_ONBOARDING_SASL_JAAS_PASSWORD}
pn.kafka-bridge.onboarding-contracts.properties.sasl.mechanism=PLAIN
pn.kafka-bridge.onboarding-contracts.properties.enable.auto.commit=true
pn.kafka-bridge.onboarding-contracts.properties.auto.commit.interval.ms=1000
pn.kafka-bridge.onboarding-contracts.properties.max.poll.records=250
pn.kafka-bridge.onboarding-contracts.properties.heartbeat.interval.ms=3000
pn.kafka-bridge.onboarding-contracts.properties.auto.offset.reset=earliest
pn.kafka-bridge.onboarding-contracts.properties.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
pn.kafka-bridge.onboarding-contracts.properties.value.deserializer=it.pagopa.pn.kafka.bridge.middleware.kafka.deserializer.OnboardingSelfCareMessageDeserializer

pn.kafka-bridge.delegations.bootstrap-servers=selc-u-eventhub-ns.servicebus.windows.net:9093
pn.kafka-bridge.delegations.group-id=pn-delegations-local
pn.kafka-bridge.delegations.topic-name=sc-delegations
pn.kafka-bridge.delegations.auth-exception-retry-interval=60s
pn.kafka-bridge.delegations.properties.security.protocol=SASL_SSL
pn.kafka-bridge.delegations.sasl-jaas-password=${KAFKA_DELEGATIONS_SASL_JAAS_PASSWORD}
pn.kafka-bridge.delegations.properties.sasl.mechanism=PLAIN
pn.kafka-bridge.delegations.properties.enable.auto.commit=true
pn.kafka-bridge.delegations.properties.auto.commit.interval.ms=1000
pn.kafka-bridge.delegations.properties.max.poll.records=250
pn.kafka-bridge.delegations.properties.heartbeat.interval.ms=3000
pn.kafka-bridge.delegations.properties.auto.offset.reset=earliest
pn.kafka-bridge.delegations.properties.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
pn.kafka-bridge.delegations.properties.value.deserializer=it.pagopa.pn.kafka.bridge.middleware.kafka.deserializer.DelegationSelfCareMessageDeserializer

# ---------- payment-events (nuovo consumer, batch + commit manuale) ----------
pn.kafka-bridge.payment-events.bootstrap-servers=10.1.41.75:9092
pn.kafka-bridge.payment-events.group-id=pn-payments-local
pn.kafka-bridge.payment-events.topic-name=payment_events
pn.kafka-bridge.payment-events.properties.security.protocol=PLAINTEXT
pn.kafka-bridge.payment-events.sasl-jaas-password=${KAFKA_PAYMENT_SASL_JAAS_PASSWORD}
pn.kafka-bridge.payment-events.properties.sasl.mechanism=PLAIN
pn.kafka-bridge.payment-events.properties.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
pn.kafka-bridge.payment-events.properties.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
pn.kafka-bridge.payment-events.properties.enable.auto.commit=false
pn.kafka-bridge.payment-events.properties.auto.offset.reset=latest
pn.kafka-bridge.payment-events.properties.max.poll.records=250
pn.kafka-bridge.payment-events.properties.fetch.min.bytes=256000
pn.kafka-bridge.payment-events.properties.fetch.max.wait.ms=500
pn.kafka-bridge.payment-events.concurrency=1
pn.kafka-bridge.payment-events.properties.max.poll.interval.ms=300000
pn.kafka-bridge.payment-events.properties.session.timeout.ms=30000
pn.kafka-bridge.payment-events.properties.request.timeout.ms=60000
pn.kafka-bridge.payment-events.properties.metadata.max.age.ms=180000
pn.kafka-bridge.payment-events.properties.connections.max.idle.ms=180000

pn.kafka-bridge.onboarding-topic-name=sc-contracts
#pn.kafka-bridge.selfcare-pn-product-id=prod-pn-dev

management.endpoints.web.exposure.include=health,metrics,loggers

#Kafka bootstrap servers local config
spring.kafka.consumer.bootstrap-servers=PLAINTEXT://localhost:29092
pn.kafka-bridge.onboarding-group-id=pn-external-registries-local

# Application configurations
pn.kafka-bridge.sqs-topics.onboarding-input=local-onboarding-institutes
pn.kafka-bridge.sqs-topics.delegations-input=local-kafka_bridge_delegations
pn.kafka-bridge.sqs-topics.error-event-input=local-kafka-bridge-payments-DLQ
pn.kafka-bridge.sqs-topics.kafka-bridge-payments=local-kafka-bridge-payments
pn.kafka-bridge.sqs-topics.payments-to-verify=local-payments-to-verify

pn.kafka-bridge.metrics.payments-events.cron:0 */5 * * * *

# Set the Standard queue URL to enable malformed payment batch delivery.
# pn.kafka-bridge.payment-sqs.malformed-queue-url=https://sqs.<region>.amazonaws.com/<account>/<queue>
pn.kafka-bridge.payment-sqs.parallelism=3
pn.kafka-bridge.payment-sqs.request-timeout=30s