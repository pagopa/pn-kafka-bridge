logging.config=classpath:logback-base.xml

spring.application.name=PN-KAFKA-BRIDGE

#kafka global settings
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.max-poll-records=250
spring.kafka.consumer.heartbeat-interval=3000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.sasl.mechanism=PLAIN
spring.kafka.consumer.properties.security.protocol=SASL_SSL
#
pn.kafka-bridge.onboarding.topic-name=${PN_KAFKA_BRIDGE_ONBOARDING_TOPIC_NAME:sc-contracts}
pn.kafka-bridge.onboarding.group-id=${PN_KAFKA_BRIDGE_ONBOARDING_GROUP_ID:${pn.kafka-bridge.onboarding-group-id:pn-external-registries-local}}
pn.kafka-bridge.onboarding.queue-name=${PN_KAFKA_BRIDGE_SQS_TOPICS_ONBOARDING_INPUT:local-onboarding-institutes}
pn.kafka-bridge.onboarding.sasl-jaas-password=${KAFKA_ONBOARDING_SASL_JAAS_PASSWORD}
pn.kafka-bridge.delegations.topic-name=${PN_KAFKA_BRIDGE_DELEGATIONS_TOPIC_NAME:sc-delegations}
pn.kafka-bridge.delegations.group-id=${PN_KAFKA_BRIDGE_DELEGATIONS_GROUP_ID:pn-kafka-bridge-local}
pn.kafka-bridge.delegations.queue-name=${PN_KAFKA_BRIDGE_DELEGATIONS_QUEUE_NAME:local-kafka_bridge_delegations}
pn.kafka-bridge.delegations.sasl-jaas-password=${KAFKA_DELEGATIONS_SASL_JAAS_PASSWORD}
#pn.kafka-bridge.selfcare-pn-product-id=prod-pn-dev

management.endpoints.web.exposure.include=health,metrics,loggers

# Configurazioni AWS
aws.region-code=us-east-1
aws.profile-name=${PN_AWS_PROFILE_NAME:default}
aws.endpoint-url=http://localhost:4566


#Kafka bootstrap servers local config
spring.kafka.consumer.bootstrap-servers=PLAINTEXT://localhost:29092
pn.kafka-bridge.onboarding-group-id=pn-external-registries-local
